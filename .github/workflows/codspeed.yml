name: CodSpeed

on:
  push:
    branches: [main]
    paths:
      - 'delaynet/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/codspeed.yml'
  pull_request:
    paths:
      - 'delaynet/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/codspeed.yml'
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: astral-sh/setup-uv@v5

      - name: Sync test deps
        run: uv sync --extra test

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: uv run pytest tests/benchmarks/ --codspeed
